[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ravnexchange"
version = "0.1.1"
description = "Typed client for the RAVN integrator API (/api/v1): quote, execute, submit-signature, status. Zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "RAVN" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://ravn.exchange"
Documentation = "https://docs.ravn.exchange"
Repository = "https://github.com/ravndex/ravn-sdk"

[tool.hatch.build.targets.wheel]
packages = ["ravnexchange"]
