name: Publish Python SDK to PyPI

on:
  push:
    branches: [main]
    paths: ["python/pyproject.toml"]
  workflow_dispatch:

jobs:
  # Stdlib unittest, like the tests themselves (no pytest dependency). Its own job, so the tests run
  # without the publish job's OIDC token; nothing publishes unless they pass.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        working-directory: python
        run: python -m unittest discover -s tests

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        working-directory: python
        run: python -m build

      # No API token: PyPI's OIDC trusted-publisher trust (configured on pypi.org for this
      # repo+workflow+environment) authenticates the publish instead of a stored secret, same
      # model as publish-sdk.yml's npm OIDC publish. skip-existing covers the "already
      # published this version" case that workflow checks by hand via `npm view`.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          skip-existing: true
