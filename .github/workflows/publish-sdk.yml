name: Publish SDK packages to npm

on:
  push:
    branches: [main]
    paths: ["*/package.json"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        package: [core, react, widget-connector]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs a recent npm CLI (>=11.5.1); the one bundled with
      # setup-node is too old. npm@latest itself now requires Node >=22.22.2, hence node-version
      # 24 above (this workflow's own choice, not a repo-wide Node version convention).
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Build @ravnexchange/sdk (dependency of @ravnexchange/react)
        if: matrix.package != 'core'
        run: npm run build -w core

      - name: Build package
        run: npm run build -w ${{ matrix.package }}

      # No NODE_AUTH_TOKEN: npm's OIDC trusted-publisher trust (configured per-package on
      # npmjs.com for this repo+workflow) authenticates the publish instead of a stored secret.
      - name: Publish if this version isn't on npm yet
        working-directory: ${{ matrix.package }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version already published, skipping"
          else
            npm publish --access public
          fi
