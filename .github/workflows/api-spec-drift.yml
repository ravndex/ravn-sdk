name: API spec drift

# core/openapi.json is the copy of RAVN's API spec that core's types are generated from. RAVN's API
# adds fields before the SDK publishes them, so this goes red while the live API's version (its
# info.version: the date of its latest change) is ahead of the copy's. Fix: `npm run sync:spec`,
# then a release. Publishes nothing.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # `shell: bash` runs with pipefail, so a failed fetch fails the step instead of reading as "".
      # Versions are dates (YYYY-MM-DD), so a string comparison orders them; a copy ahead of the live
      # API (an app PR not deployed yet) is fine.
      - name: Compare the live API's version with core/openapi.json's
        shell: bash
        run: |
          live=$(curl -fsS https://app.ravn.exchange/openapi.json | jq -er .info.version)
          copy=$(jq -er .info.version core/openapi.json)
          echo "Live API: $live. SDK types: $copy."
          if [[ "$live" > "$copy" ]]; then
            echo "::error::RAVN's API is at $live, the SDK's types at $copy: run npm run sync:spec, then release the SDK."
            exit 1
          fi
