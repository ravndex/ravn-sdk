name: CI

# The checks publish-sdk.yml and publish-python-sdk.yml run before publishing, on every PR, so a
# PR is green before its merge publishes anything. Publishes nothing.
on:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        working-directory: python
        run: python -m unittest discover -s tests
